# ============================================================
# Konfigurasi Tema Streamlit — Elegant Dark (Champagne Gold)
# File ini harus berada di folder .streamlit/ yang sejajar
# dengan app.py saat menjalankan: streamlit run app.py
# ============================================================

[theme]
base = "dark"

# Aksen champagne gold: slider, radio, tab aktif, tombol
primaryColor = "#60A5FA"

# Latar utama: hitam arang hangat
backgroundColor = "#09090E"

# Latar sidebar dan widget
secondaryBackgroundColor = "#12121A"

# Teks utama: putih gading
textColor = "#F5F3EE"

font = "sans serif"
